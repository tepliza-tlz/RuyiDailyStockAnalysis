<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep space-like background -->
    <radialGradient id="bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <!-- Blue glow gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <!-- Gold gradient for highlight -->
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <!-- Trend line gradient -->
    <linearGradient id="trend" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background rounded rect with subtle border + glow -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1"/>
  <rect x="1" y="1" width="62" height="62" rx="13.5" fill="none" stroke="url(#blueGlow)" stroke-width="3" opacity="0.4"/>

  <!-- Ambient glow behind the chart area -->
  <ellipse cx="32" cy="32" rx="22" ry="22" fill="url(#blueGlow)" opacity="0.5"/>

  <!-- Chart grid lines (very subtle) -->
  <g opacity="0.06" stroke="#94a3b8" stroke-width="0.5">
    <line x1="12" y1="12" x2="52" y2="12"/>
    <line x1="12" y1="20" x2="52" y2="20"/>
    <line x1="12" y1="28" x2="52" y2="28"/>
    <line x1="12" y1="36" x2="52" y2="36"/>
    <line x1="12" y1="44" x2="52" y2="44"/>
    <line x1="12" y1="52" x2="52" y2="52"/>
    <line x1="16" y1="8" x2="16" y2="56"/>
    <line x1="24" y1="8" x2="24" y2="56"/>
    <line x1="32" y1="8" x2="32" y2="56"/>
    <line x1="40" y1="8" x2="40" y2="56"/>
    <line x1="48" y1="8" x2="48" y2="56"/>
  </g>

  <!-- Candlestick bar (green, subtle) -->
  <rect x="17" y="36" width="4" height="14" rx="1" fill="#22c55e" opacity="0.35"/>
  <line x1="19" y1="34" x2="19" y2="36" stroke="#22c55e" stroke-width="1.5" opacity="0.35"/>
  <line x1="19" y1="50" x2="19" y2="52" stroke="#22c55e" stroke-width="1.5" opacity="0.35"/>

  <!-- Red candlestick bar -->
  <rect x="26" y="42" width="4" height="8" rx="1" fill="#ef4444" opacity="0.25"/>
  <line x1="28" y1="40" x2="28" y2="42" stroke="#ef4444" stroke-width="1.5" opacity="0.25"/>
  <line x1="28" y1="50" x2="28" y2="52" stroke="#ef4444" stroke-width="1.5" opacity="0.25"/>

  <!-- Main trend line (upward) -->
  <path d="M10 52 L20 42 L30 44 L40 28 L52 14"
        stroke="url(#trend)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Glow under the end point -->
  <circle cx="52" cy="14" r="8" fill="#3b82f6" opacity="0.12" filter="url(#glowStrong)"/>

  <!-- Data points on the line -->
  <circle cx="20" cy="42" r="2.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="30" cy="44" r="2.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="40" cy="28" r="2.5" fill="#60a5fa" opacity="0.7"/>

  <!-- Final highlight node (gold) -->
  <circle cx="52" cy="14" r="4.5" fill="url(#gold)" filter="url(#glow)"/>
  <circle cx="52" cy="14" r="2.5" fill="#fef3c7"/>
  <circle cx="52" cy="14" r="1.2" fill="#ffffff" opacity="0.6"/>

  <!-- Small AI node dots -->
  <circle cx="30" cy="44" r="1" fill="#fbbf24" opacity="0.9"/>
  <circle cx="40" cy="28" r="1" fill="#93c5fd" opacity="0.9"/>
</svg>
